name: One-shot architecture render sync

on:
  push:
    branches: ["66"]

permissions:
  actions: read
  contents: write

jobs:
  sync:
    if: github.repository == 'tastile/tastile-root'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "66"

      - name: Download trusted render artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11023675588"
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/tastile/tastile-root/actions/artifacts/$ARTIFACT_ID/zip" \
            --output /tmp/render.zip

      - name: Replace only rendered SVG outputs
        run: |
          set -euo pipefail
          for name in context containers trust-zones deployment-production deployment-staging; do
            unzip -p /tmp/render.zip "$name.svg" > "architecture/views/$name.svg"
            test -s "architecture/views/$name.svg"
          done

      - name: Commit generated SVGs and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/sync-architecture-render.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/views/context.svg \
                  architecture/views/containers.svg \
                  architecture/views/trust-zones.svg \
                  architecture/views/deployment-production.svg \
                  architecture/views/deployment-staging.svg \
                  .github/workflows/sync-architecture-render.yml
          git diff --cached --quiet && exit 0
          git commit -m "architecture: refresh rendered views"
          git push origin HEAD:66
