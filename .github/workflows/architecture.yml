name: Architecture SoT gate

on:
  push:
    branches: [main, "release-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Verify CI dispatcher recovery and fencing
        run: bun test infra/gcp/ci-dispatcher/index.test.ts infra/gcp/ci-dispatcher/server.test.ts
      - name: Verify Infisical development/testing scope
        run: bun test infra/infisical-development-testing/guard.test.ts
      - name: Verify value-silent GitHub OIDC probe
        run: bun test infra/infisical-workload-proof/probe.test.ts
      # Regenerating must be a no-op: the committed views/catalogs must equal the model output.
      - name: Generate views and catalogs
        run: bun run architecture:generate
      - run: git diff --exit-code -- architecture/views architecture/generated
      - name: Validate model, references, boundaries and freshness
        run: bun run architecture:validate
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Install pinned D2
        run: |
          set -euo pipefail
          ver=0.9.0
          curl -fsSL -o d2.tar.gz "https://github.com/terrastruct/d2/releases/download/v${ver}/d2-v${ver}-linux-amd64.tar.gz"
          tar xzf d2.tar.gz
          echo "$PWD/d2-v${ver}/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/d2-v${ver}/bin:$PATH"
          d2 --version
      - name: Render D2 views to SVG
        run: bun run architecture:render
      - name: Upload rendered architecture views
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: architecture-rendered-views
          path: architecture/views/*.svg
          if-no-files-found: error
          retention-days: 1
      - name: SVG must be committed unchanged
        run: git diff --exit-code -- architecture/views
  audit:
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Check out sibling repositories (read-only audit of stale canonical claims)
        run: |
          set -euo pipefail
          mkdir -p .tmp/siblings
          for r in tastile-core tastile-web tastile-android tastile-desktop tastile-cli; do
            if [ -d "$r/.git" ]; then
              echo "::notice::using workspace checkout $r"
              cp -r "$r" ".tmp/siblings/$r"
            else
              git clone --depth 1 "https://github.com/tastile/$r.git" ".tmp/siblings/$r" || echo "::warning::cannot clone $r"
            fi
          done
          for r in .tmp/siblings/*/; do
            ln -sfn "$(pwd)/$r" "$(basename "$r")" 2>/dev/null || true
          done
      - name: Cross-repo advisory audit
        run: bun run architecture:audit --verbose | tee .tmp/audit.txt
