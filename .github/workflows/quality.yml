name: Root quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-environment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate project-local agent environment
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/check-agent-environment.ps1
