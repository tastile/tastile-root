name: One-shot GCP infra validation

on:
  push:
    branches: ["68"]

permissions:
  contents: write

jobs:
  validate-and-self-remove:
    if: github.actor == 'rebuildup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "68"
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Compile CI dispatcher
        run: bun build --compile infra/gcp/ci-dispatcher/index.ts --outfile /tmp/tastile-ci-dispatcher
      - uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with:
          tofu_version: "1.10.7"
      - name: Validate foundation
        working-directory: infra/gcp/foundation
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate
      - name: Remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-gcp-infra-once.yml
          git commit -m "ci: remove one-shot GCP infra validator"
          git push origin HEAD:68
