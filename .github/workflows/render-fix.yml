name: One-shot architecture render repair

on:
  push:
    branches: ["66"]

permissions:
  contents: write

jobs:
  render-and-self-remove:
    if: github.actor == 'rebuildup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "66"
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Install pinned D2
        run: |
          set -euo pipefail
          ver=0.9.0
          curl -fsSL -o d2.tar.gz "https://github.com/terrastruct/d2/releases/download/v${ver}/d2-v${ver}-linux-amd64.tar.gz"
          tar xzf d2.tar.gz
          echo "$PWD/d2-v${ver}/bin" >> "$GITHUB_PATH"
      - name: Render canonical SVGs
        run: bun run architecture:render
      - name: Commit rendered outputs and remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/views
          git rm .github/workflows/render-fix.yml
          git commit -m "architecture: render current D2 views"
          git push origin HEAD:66
