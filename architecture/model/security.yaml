# Trust zones, credentials, data classification and secret handling.
# Canonical for: fd.trust-boundaries.
# Validator rule: a relationship whose endpoints sit in different trust zones must name a `credential`,
# unless every data class it carries is dc.public.
schema: tastile.architecture/security@1
as_of: 2026-10-06

trust_zones:
  - id: tz.user-device
    name: User device
    description: browser、Android、Windows、terminal。user が完全に制御でき、攻撃者の device でもあり得る。
    members: [actor.user, actor.api-client, ctr.android, ctr.desktop, ctr.cli, ctr.ios]
  - id: tz.edge
    name: Edge
    description: Cloudflare。TLS 終端と WAF。origin より前に位置するが user identity は判断しない。
    members: [ctr.edge, cmp.edge.router]
  - id: tz.app-runtime
    name: Application runtime (per environment)
    description: >-
      Cloud Run services / jobs。environment ごとに別 GCP project。service ごとに別 service account。
      Web と Core は同じ zone にあるが互いを暗黙に信頼せず、BFF → Core は署名付き assertion で認証する。
    members: [ctr.core-api, ctr.core-worker, ctr.core-migrate, ctr.web, cmp.core.http, cmp.core.auth, cmp.core.domain, cmp.core.storage, cmp.core.worker-drain, cmp.web.site, cmp.web.dashboard, cmp.web.bff, cmp.web.auth, cmp.web.connect, cmp.web.billing]
  - id: tz.data
    name: Data (per environment)
    description: Cloud SQL。public IP 経由の authorized network を持たず、Cloud SQL connector (IAM) 経由のみ到達可能。
    members: [ctr.domain-db, ctr.auth-db]
  - id: tz.public-object
    name: Public object storage
    description: R2。download は public read、media は署名付き upload + public read (推測不能 key)。
    members: [ctr.downloads, ctr.media]
  - id: tz.third-party
    name: Third-party services
    description: 外部 SaaS / platform。
    members: [ext.google-identity, ext.apple-identity, ext.stripe, ext.email, ext.fcm, ext.webpush, ext.google-calendar, ext.github, ext.google-play, ext.scheduler, ext.infisical, ext.aws]
  - id: tz.build
    name: Build and contract distribution
    description: CI runner と生成 artifact repository。
    members: [repo.openapi]
  - id: tz.operator
    name: Operator & agents
    description: 開発者 host と開発 agent。production data plane へ直接の常設経路を持たない。
    members: [actor.operator, actor.dev-agent]

credentials:
  - id: cred.user-session
    name: Account session (Better Auth)
    holder: browser / native client during sign-in
    verifier: cmp.web.auth
    properties: httpOnly Secure SameSite cookie (browser) or Better Auth bearer; `__Secure-` prefix 対応
    lifecycle: retained
  - id: cred.core-api-token
    name: Core API token
    holder: native clients, automation clients
    verifier: cmp.core.auth
    properties: >-
      opaque random、Core DB には hash のみ保存、scope (tastile.read / tastile.write; write は read を含まない)、
      expiry と revoke を持つ。client は OS secure storage (Keystore / DPAPI / keyring) に保存する。
    lifecycle: retained
  - id: cred.web-core-jwt
    name: Web-to-Core assertion
    holder: cmp.web.bff (per request)
    verifier: cmp.core.auth (JWKS cache)
    properties: EdDSA 署名、aud=tastile-core、iss=web origin、sub=Better Auth user id、exp ≤ 5 min、jti 任意
    decision: adr.root.0016
    lifecycle: planned
  - id: cred.web-bridge-secret
    name: Web bridge shared secret (retiring)
    holder: ctr.web
    verifier: cmp.core.auth
    properties: >-
      shared secret + user header。secret を持つ者は任意 user として振る舞える。blast radius が全 user に及ぶため
      ADR-0016 で廃止する。
    lifecycle: retiring
    retire_by: ms.m4-web-staging
  - id: cred.edge-assertion
    name: Edge assertion header
    holder: cmp.edge.router
    verifier: ctr.web, ctr.core-api (production / staging middleware)
    properties: origin 直アクセス (run.app) を拒否するための低権限 shared secret。identity を表さない。四半期 rotate。
    lifecycle: planned
  - id: cred.gcp-service-identity
    name: GCP service account (workload identity)
    holder: each Cloud Run service / job, Cloud Scheduler
    verifier: Google IAM
    properties: service ごとに分離 (sa-core-api, sa-core-worker, sa-core-migrate, sa-web, sa-scheduler)。key file を作らない。
    lifecycle: planned
  - id: cred.github-oidc-wif
    name: GitHub OIDC → GCP Workload Identity Federation
    holder: GitHub Actions deploy / publish jobs
    verifier: Google IAM (attribute condition = repository + ref + workflow)
    properties: GCP control plane 用の短命 workload identity。secret delivery には使わず、long-lived GCP key を作らない。
    lifecycle: planned
  - id: cred.github-infisical-oidc
    name: GitHub OIDC → Infisical machine identity
    holder: GitHub Actions jobs that require Tastile-managed secrets
    verifier: Infisical OIDC auth (repository / environment / workflow claims)
    properties: static Infisical token / GitHub Secret なし。Infisical identity ID / project ID は non-secret pointer。
    lifecycle: retained
  - id: cred.gcp-infisical-auth
    name: GCP workload → Infisical machine identity
    holder: Cloud Run services / jobs
    verifier: Infisical GCP-native auth
    properties: GCP service account の短命 identity token を使う。INFISICAL_TOKEN / service-account JSON key を持たない。
    lifecycle: planned
  - id: cred.github-ci-app
    name: Tastile private-CI GitHub App
    holder: sa-ci-dispatcher (private key is fetched from Infisical at runtime)
    verifier: GitHub App authentication
    properties: private key の canonical value は Infisical のみ。App ID / installation ID は non-secret。installation token は短命で永続化しない。
    lifecycle: planned
  - id: cred.db-core-runtime
    name: DB role tastile_app
    holder: sa-core-api, sa-core-worker
    verifier: PostgreSQL
    properties: domain-db の DML のみ。DDL / role 作成権限なし。credential value は Infisical。
    lifecycle: planned
  - id: cred.db-core-migrate
    name: DB role tastile_migrator
    holder: sa-core-migrate
    verifier: PostgreSQL
    properties: domain-db schema owner。migrate job だけが使う。credential value は Infisical。
    lifecycle: planned
  - id: cred.db-auth-runtime
    name: DB role tastile_auth
    holder: sa-web
    verifier: PostgreSQL
    properties: tastile_auth database のみ。domain-db への CONNECT 権限なし。credential value は Infisical。
    lifecycle: retained
  - id: cred.r2-media
    name: R2 token (media bucket)
    holder: sa-core-api (Infisical-injected)
    verifier: Cloudflare R2
    properties: tastile-media-<env> bucket の object read/write のみ。
    lifecycle: planned
  - id: cred.r2-downloads-publish
    name: R2 token (downloads publish)
    holder: tastile-desktop release job
    verifier: Cloudflare R2
    properties: tastile-downloads bucket の write のみ。release environment の approval 後にだけ取得。
    lifecycle: retained
  - id: cred.oauth-client
    name: OAuth client secrets (Google / Apple)
    holder: sa-web
    verifier: identity provider
    lifecycle: retained
  - id: cred.stripe-api
    name: Stripe secret key
    holder: sa-web
    verifier: Stripe
    lifecycle: retained
  - id: cred.stripe-webhook
    name: Stripe webhook signing secret
    holder: Stripe (signer) / sa-web (verifier)
    verifier: cmp.web.billing
    lifecycle: retained
  - id: cred.email-api
    name: Email provider API key
    holder: sa-web, sa-core-worker
    verifier: ext.email
    lifecycle: planned
  - id: cred.vapid
    name: Web Push VAPID key pair
    holder: sa-core-worker
    verifier: push service
    lifecycle: planned
  - id: cred.delivery-key
    name: Delivery endpoint encryption key
    holder: sa-core-api, sa-core-worker
    verifier: Core (AEAD)
    properties: Delivery endpoint token の保存時暗号化 key (TASTILE_DELIVERY_KEY)。
    lifecycle: retained
  - id: cred.android-upload-key
    name: Android upload key
    holder: tastile-android release job
    verifier: Google Play (Play App Signing)
    properties: Play App Signing を前提とし、upload key / password の canonical value は Infisical。repository / CI log に出さない。
    lifecycle: retained

data_classes:
  - id: dc.credential
    name: Credentials
    description: token、hash、secret、key。log・Issue・会話・artifact に出さない。
  - id: dc.pii
    name: Personal data
    description: email、display name、avatar、IP 等。
  - id: dc.user-content
    name: Life schedule content
    description: >-
      Tile / SourceTile / Placement / Execution / memo。生活時間そのものであり PII と同等以上に扱う。
      第三者 analytics へ送らない。
  - id: dc.billing
    name: Billing data
    description: Stripe customer / subscription 参照。card data は Tastile に来ない。
  - id: dc.telemetry
    name: Operational telemetry
    description: request log、metric、trace、push hint。user-content と credential を含めない。
  - id: dc.public
    name: Public
    description: 公開してよい data (installer、manifest、JWKS、LP)。

secret_handling:
  store: Self-hosted Infisical (single editable SoT; environment/project separated)
  decision: adr.root.0015
  rules:
    - id: sec.single-editable-store
      rule: Tastile-managed secret / long-lived authentication material の編集可能な store は Infisical だけ。platform binding は deploy 時の一方向 replica。
    - id: sec.workload-auth
      rule: GitHub は OIDC、GCP runtime は GCP-native workload identity で Infisical machine identityへ入る。INFISICAL_TOKEN / service token / GCP SA key を置かない。
    - id: sec.auth-material-closure
      rule: development / build / CI / deploy / runtime の長期認証 material は Infisical 以外へ置かない。provider-managed static credential を要求する integration は採用せず、workload identity + Infisical-backed credentialへ置換する。
    - id: sec.no-long-lived-provider-keys
      rule: GCP service-account key、AWS access key、GitHub保存の deploy token を作らない。外部 SaaS が API key しか持たない場合、その値は Infisical に置く。
    - id: sec.fail-closed
      rule: 必須 secret / config が取得できない場合は起動・build・deploy を失敗させる。dotenv や既定値へ fallback しない。
    - id: sec.no-secret-in-repo
      rule: secret 実値・ciphertext・dotenv を repository / GitHub Secrets / GCP Secret Manager の Tastile-managed entry に置かない。non-secret identity/project pointerだけrepositoryからdiscoverableにする。
    - id: sec.local-dev
      rule: local 開発は人間の Infisical loginからdev environmentだけを取得する。production / staging secretを恒久保存しない。必要な materialization はgitignored・permission-restricted・使用後削除。
    - id: sec.replica-one-way
      rule: Cloudflare / Google Play 等がsecret replicaを要求する場合、Infisical→platform の一方向同期だけを許可し、platform側編集を正本に戻さない。

controls:
  - id: ctl.infisical-development-testing
    rule: >-
      ADR-0022によりInfisical v0.165.15の開発・検証限定RBAC改変を許可する。
      TASTILE_INFISICAL_DEVELOPMENT_TESTINGが厳密に1、認証済orgがd808df2c-ec67-4046-b733-8c0db0bfa47d、
      scope keyがprojectId、projectがdev949b4193-a226-4620-8371-726a37c7195bまたはstaging44081e84-5983-4cc2-9fc9-dca5363005e1のときだけ
      custom role作成/更新とidentityへのproject role割当/更新のplan restrictionへ例外を設ける。production ab532e90-acde-40e6-a206-3976743e5da5とorg scopeは対象外。
      actor permission guard、secret read/write判定、global plan、license keyは維持する。
      rollback前にこの評価で作成したidentityのproject割当を削除し、devtest-tastile- prefixの評価roleを削除・0件確認する。
      GCP検証ではoperatorにdevのsa-ci-dispatcherだけのroles/iam.serviceAccountOpenIdTokenCreatorを最大30分の期限条件付きで一時付与でき、検証後に当該bindingを削除する。長期SA keyやaccess-token/signing権限は追加しない。
      既存role/assignmentとproduction設定は保存する。改変版をproduction用途のRBACとして使用しない。
  - id: ctl.secret-sot-infisical
    rule: development / CI/CD / runtime の Tastile-managed secret value は Infisical だけを canonical とし、他 provider の editable secret store を増やさない。
  - id: ctl.owner-boundary
    rule: 他 owner の resource は存在しないものとして扱う (Core が強制; core v1/10-invariants.md §3)。
  - id: ctl.command-only-writes
    rule: domain 書き込みは Core Command API だけ。actor と occurredAt は server 側で確定する。
  - id: ctl.no-client-db
    rule: client (browser / native / CLI) は DB に接続しない。Web server の DB 接続は auth-db に限る。
  - id: ctl.webhook-signature
    rule: 外部 webhook は署名検証なしに処理しない。
  - id: ctl.rate-limit
    rule: auth と write endpoint は edge (WAF rate limit) と app (Core rate limit) の二段で制限する。
  - id: ctl.pr-ci-least-privilege
    rule: private PR CIのGitHub credentialはtrusted sa-ci-dispatcherだけがInfisicalから取得し、PR buildには渡さない。sa-cloud-build-ciはLogging Writer + source readのみでArtifact Registry / Infisical / deploy権限を持たない。
  - id: ctl.ci-dispatcher-http
    rule: ADR-0023のdev CI dispatcherはinternal ingressとservice-level IAMで同一projectのsa-ci-dispatcherだけを許可する。Scheduler短期OIDCのaudienceはcanonical service URL（path/queryなし）、POST /dispatchは空bodyだけ。allUsers/allAuthenticatedUsersを許可せず、Scheduler service agentの既定roleを保持する。min0/max1/concurrency1、request課金で実時間と費用を計測する。
      認証拒否の検証に限りdevの一時Schedulerを作り、未認証およびinvoker権限のない既存publish SAのOIDCで同じserviceを単発呼出できる。IAM許可を増やさず、検証後に一時Schedulerを削除・不存在を確認する。
  - id: ctl.github-infisical-development-proof
    rule: >-
      poc.infisical-workload-authのGitHub経路はdev project949b4193-a226-4620-8371-726a37c7195bのdev environment内で一時canaryだけを使う。
      一時devtest-tastile-root-oidc identityはorg no-access、Universal Authを除去してからprojectへ割当し、/tastile/oidc-g4-proof/OIDC_PROOF_CANARYのdescribeSecret/readValueだけを許可する。
      issuer/discoveryはhttps://token.actions.githubusercontent.com、audienceはhttps://github.com/tastile、subjectはrepo:tastile/tastile-root:ref:refs/heads/release-0-7-0。
      repository/repository_id1287977553/repository_owner_id267846510/ref/ref_type/event_name=push/workflow_refをexact claimとして固定し、workflow_refはtastile/tastile-root/.github/workflows/infisical-oidc-proof.yml@refs/heads/release-0-7-0だけを許可する。
      GitHub jobにenvironmentを設定せず、OIDC/access tokenはRAMのみ、Infisical token TTL/maxTTL300s・uses1。hosted runnerの変動IPに対しsigned issuer/claimの境界を使う。
      同repo実PRと同release refの別workflowは新しいGitHub ID tokenでInfisical exchangeの拒否を確認する。token/secret実値をlog/artifactへ出さず、許可claim subsetとHTTP statusだけを記録する。
      検証後は一時project割当/identity/role/canary/owned folderを削除し不存在を確認する。恒久CI identity、既存roles/secret、staging/productionを変更しない。
  - id: ctl.ci-evaluation-binding
    rule: CI評価identity devtest-tastile-ci-dispatcherはorg builtin no-access、Infisical dev projectのdev environment /tastile/ci/GITHUB_CI_APP_PRIVATE_KEYだけにdescribeSecret/readValueを許可する。GCP-native authはsa-ci-dispatcher@tastile-dev.iam.gserviceaccount.comだけ、tokenTTL/maxTTL300s、write/role管理/他environment/projectは拒否する。publish専用sa-cloud-build-publishのsource readは既存private7日source bucketのObject Viewerだけを追加でき、PR CIにはpublish権限を与えない。
  - id: ctl.staging-core-runtime-bootstrap
    rule: >-
      staging評価のCore API/worker/migratorはserviceごとのdevtest-tastile-staging-core-* identityとread-only custom roleを使う。
      org roleはno-access、GCP-native ID token authは対応するsa-core-api/sa-core-worker/sa-core-migrate@tastile-staging.iam.gserviceaccount.comだけを許可し、Universal AuthやSA keyを追加しない。TTL/maxTTLは300秒。
      projectはstaging44081e84-5983-4cc2-9fc9-dca5363005e1、environmentはstaging、service pathは/tastile/core/api・/tastile/core/worker・/tastile/core/migrateに分離する。
      api/workerが共用するDB URLとdelivery暗号keyの正本は/tastile/core/sharedのTASTILE_DATABASE_URLとTASTILE_DELIVERY_KEYだけとし、service pathから同environmentのsecret referenceで参照する。migrator URLはmigrate pathに別credentialで置く。
      roleは自身のservice pathと必要なshared keyのdescribeSecret/readValueだけを許可し、write・role管理・他service・他environment/project・production readを拒否する。importは使わず、secret reference展開だけを許可する。
      ms.m4-web-stagingでJWTへ移行するまで、APIだけは既存の/tastile/core/TASTILE_WEB_BRIDGE_SECRETをservice pathのsecret referenceから読み、同じstaging environmentの当該keyだけに追加readを許可する。編集可能なcopyを作らず、worker/migratorへ許可せず、JWT移行時にreferenceと追加ACLを削除する。
      Infisical selectorはRoot deployment adapterの非秘密設定、アプリ設定はCoreが検証する。INFISICAL_DOMAINはHTTPS originとし、CLI adapterが/apiを付ける。人間profile/SSH/license keyをアプリruntimeへ渡さない。
      tokenと取得valueはRAMのみ。bootstrap後にcontrol-plane token/selectorをappへ継承させず、取得失敗・必須値欠如は起動拒否する。
      SQL bootstrap用POSTGRES_ADMIN_PASSWORDはoperator専用/tastile/platform/cloud-sqlのInfisical値を正本にし、runtime identityへreadを与えない。API/workerはDML role、migratorだけがschema ownerを使う。state/plan/argv/logへcredentialを出さない。
      正式production license/auth境界は別gateであり、staging評価identityをproductionへ転用しない。
  - id: ctl.staging-core-fcm
    rule: >-
      stagingのFCM/Firebase capabilityはtastile-stagingだけで有効化し、production projectへ転用しない。
      sa-core-workerだけにproject custom role coreFcmSenderのcloudmessaging.messages.createを付与する。topic管理・他serviceへの送信権限を追加しない。
      workerはTASTILE_DELIVERY_PROVIDER=fcmと非秘密のTASTILE_FCM_PROJECT_ID=tastile-stagingを明示し、固定GCP metadata endpointの短期OAuthで固定FCM HTTP v1 endpointを呼ぶ。SA key/file/static bearerや外部gatewayを作らない。
      push payloadはsession_idとstable delivery_idだけのhintとし、domain stateやtitle/bodyを送らない。FCM受理と端末受信を区別し、再送hintからbusiness side effectを作らない。実端末のSync/Readと重複hint検証はms.m5-clientsに残す。
      API有効化とFirebase project bootstrapはIaCとoperator journalで管理し、既存projectの削除・再作成を行わない。
  - id: ctl.staging-restore-drill
    rule: >-
      staging PITR検証はtastile-staging-pgをsourceとし、root50-g21-restore-20261017という新規一時instanceへ復元する。source/productionへの上書きrestore・削除・credential変更を禁止する。
      sourceへのsynthetic writeは専用probe userの認証済みCore APIだけから行い、snapshot timestamp・table別count/content digest・write sequenceを固定して、復元側のrow parityと同imageの/v1/readyを確認する。
      cloneは同region・同db-f1-micro/10GiB・authorized network無し・Cloud SQL connector必須。確認用jobはsa-core-apiのInfisical認証後にRAM内だけでDSNのconnection nameをcloneへ差し替え、cloneだけをmountし、schema mutationを行わない。
      一時clone/jobはgenerationと作成receiptで所有権を固定し、検証後に当該一時resourceだけをcleanupする。元instanceのdeletion protection/prevent_destroyは維持する。上限60分を目安とする一時費用は1USD未満と見込み、失敗時は実状態を照合してcleanupし、未検証を成功扱いしない。
  - id: ctl.staging-media
    rule: >-
      staging mediaはCloudflare account c6ab6651a5d4d6d0d07686bbd3c3d56fのtastile-media-stagingだけを使い、Standard/APAC automaticで作成する。既存bucket/production mediaを変更しない。
      bucketはprivateで作成し、署名付きuploadのS3 APIとavatar配信用staging-media.tastile.appのpublic readを区別する。r2.devは有効にしない。独立staging originだけのCORSを設定する。
      新runtime credentialは当該bucketのobject read/writeだけに制限し、Cloudflare account全体のadmin tokenをappへ渡さない。Infisical staging projectの/tastile/core/apiにCore-owned TASTILE_AVATAR_ACCESS_KEY_ID/SECRET_ACCESS_KEY/HMAC_SECRETを唯一の編集可能な正本として保存する。key実値をstate/argv/log/chatへ出さない。
      endpoint/bucket/region/CDN base/feature flagはRoot deployment adapterの非秘密設定、credential取得は既存sa-core-apiのservice path権限で行う。設定・R2 write/read/copy/delete・API upload/commit/readの実確認前にmedia接続成功としない。
  - id: ctl.staging-worker-trigger-probe
    rule: >-
      常設core-worker-sweepをpausedのまま認証付きdrainを確認するため、stagingの一時Scheduler root50-g21-worker-probeだけを作成できる。次の自動実行は翌年1月1日とし、manual runを1回だけ行う。
      既存sa-schedulerの短期OIDCとcanonical worker URLのaudience、空bodyのPOST /drainを使い、IAM権限追加・公開ingress化・静的tokenを禁止する。retry_count=0、deadline=60秒とし、実応答を確認後に一時Jobを削除して不存在を確認する。
      HTTP応答が失敗した場合の診断に限り、同じverified image・sa-core-worker・Infisical worker path・pool上限3の一時Cloud Run Job root50-g21-worker-cli-probeで既存worker drain CLIを1回実行し、JSON reportを取得できる。schema変更・retry・追加IAMを行わず、常設Schedulerはpausedを維持し、診断後にJobを削除する。Flow timeoutの切り分けに限り、別の一時Job root50-g21-worker-flow-probeで同じ設定を用い、既存のmaintenance_batch=1・item_budget_ms=54000・work_lease_secs=60だけを変更した単一owner診断を1回実行できる。追加IAM・恒久設定変更・自動retryは禁止し、実行後にJobを削除する。
  - id: ctl.staging-worker-sampled-probe
    rule: >-
      Flow timeoutの実原因を区別するため、root50-g22-worker-sampled-probeをverified f0c image・既存worker SA/path/pool3・通常設定のまま1回だけ実行し、同時にread-only pg_stat_activityを最大90秒・200ms間隔で観測できる。query本文/引数やsecretは記録せず、query分類/hash・状態・待機時間だけを保存する。追加IAM・schema変更・恒久設定変更・自動retryは行わない。常設Schedulerはpausedを維持し、実行終了後に所有UIDを照合してJobを削除・不存在確認する。
  - id: ctl.staging-worker-replay-probe
    rule: >-
      Flow replay冪等化の実効性を確認するため、独立レビュー済み・exact OCI rollback証明済みの候補imageをcore-workerへ配備した後に限り、root50-g23-worker-drain-probeを同じimage・既存worker SA/path/pool3・通常設定・deadline 55000msのまま1回だけ実行できる。
      追加IAM・schema変更・恒久設定変更・自動retryは行わない。常設Schedulerはpausedを維持し、in_flight_unknown=0かつfailures=0のreportを得るまでworker成功と判定しない。実行終了後に所有UIDを照合してJobを削除・不存在確認する。
  - id: ctl.staging-worker-prefilter-probe
    rule: >-
      busy span range絞込み (Core 3e735e6) の効果を確認するため、独立レビュー済み・exact OCI rollback証明済みの同候補imageをcore-workerへ配備した後に限り、root50-g23c-worker-drain-probeを同じimage・既存worker SA/path/pool3・通常設定・deadline 55000msのまま1回だけ実行できる。
      追加IAM・schema変更・恒久設定変更・自動retryは行わない。常設Schedulerはpausedを維持し、in_flight_unknown=0かつfailures=0のreportを得るまでworker成功と判定しない。実行終了後に所有UIDを照合してJobを削除・不存在確認する。
  - id: ctl.prod-mutation-authority
    rule: production data / secret / DNS の mutation は actor.operator の承認した job だけが行う。agent は staging までの authority。
