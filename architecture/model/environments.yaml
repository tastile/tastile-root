# Environments. Canonical for: fd.environments.
# Hostnames use single-level subdomains of tastile.app so that Cloudflare Universal SSL (*.tastile.app)
# covers them on the Free plan (evidence: tastile-web docs/cloudflare-staging.md — nested
# `staging.api.tastile.app` edge TLS failed).
schema: tastile.architecture/environments@1
as_of: 2026-09-29

isolation_rules:
  - id: iso.no-shared-state
    rule: environment 間で database instance、secret 値、service identity、bucket、backup 先を共有しない。
  - id: iso.no-prod-data-downstream
    rule: production data を staging / local / ci へ copy しない。restore drill は production project 内の一時 instance で行う。
  - id: iso.same-security-mode
    rule: staging は production と同じ認証・認可・guard を有効にする (TASTILE_ENV で security を弱めない)。
  - id: iso.one-artifact
    rule: staging で検証した artifact digest をそのまま production に promotion する。environment ごとに再 build しない。
  - id: iso.no-bypass-auth
    rule: auth bypass (TASTILE_BYPASS_AUTH、E2E_BYPASS_AUTH 等) は local と ci でのみ有効化でき、staging / production では起動時に拒否する。

environments:
  - id: env.local
    name: local
    purpose: 開発者 host 上の開発・debug。
    data: 合成 data のみ。いつでも破棄できる。
    database: >-
      host 上の PostgreSQL 17 (portable binary / OS package / container のいずれでもよい)。provider 依存の機能を使わない。
    secrets: >-
      production / staging の secret は使わない。外部 provider の dev credential が必要な場合のみ Infisical dev environment の
      dev project から一時取得する。dotenv fallback は作らない。
    hostnames: {web: "http://localhost:3000", api: "http://127.0.0.1:31400"}
    lifecycle: retained
  - id: env.ci
    name: ci
    purpose: PR / release branch の自動検査。
    data: job ごとに作って捨てる PostgreSQL service。
    database: CI job 内の PostgreSQL 17 service container。
    secrets: 原則なし。publish job のみ workload identity で必要最小限を取得する。
    hostnames: {}
    lifecycle: retained
  - id: env.staging
    name: staging
    purpose: release candidate の実 browser / 実 device / 実 DB 検証、migration と restore の演習。
    data: 合成 data と test account のみ。reset 可能。
    database: Cloud SQL instance `tastile-staging-pg` (idle 時は停止可)。
    secrets: Infisical staging project/environment。Cloud Run service account → Infisical GCP-native authで取得し、static tokenを置かない。
    hostnames:
      site: https://staging.tastile.app
      web: https://staging-app.tastile.app
      api: https://staging-api.tastile.app
    scale: scale-to-zero (min instances 0)
    lifecycle: planned
    current:
      note: >-
        AWS staging stack (tastile-staging-foundation: EC2 + staging RDS) と Cloudflare Worker `tastile-web-staging`
        (staging.app.tastile.app → api.staging.app.tastile.app)。target 移行後に retire。
  - id: env.production
    name: production
    purpose: 実 user への提供。
    data: 永続。backup / PITR 対象。
    database: Cloud SQL instance `tastile-prod-pg`。
    secrets: Infisical production project/environment。Cloud Run service account → Infisical GCP-native authで取得し、static tokenを置かない。
    hostnames:
      site: https://tastile.app
      web: https://app.tastile.app
      api: https://api.tastile.app
      download: https://download.tastile.app
      media: https://media.tastile.app
    scale: web / core-api は min instances 1、worker は sweep 起動
    lifecycle: retained
    current:
      note: >-
        AWS ap-northeast-1: EC2 (api / worker / web / nginx を systemd で稼働) + RDS PostgreSQL + SSM + S3 / CloudFront
        (avatar) + SES。Cloudflare proxied DNS。download.tastile.app は R2。
  - id: env.preview
    name: preview
    purpose: (retiring) Cloudflare Worker `tastile-web-preview`。
    data: staging を共有していた。
    database: staging 経由
    secrets: Worker secret
    hostnames: {}
    lifecycle: retiring
    retire_by: ms.m4-web-staging
    notes: >-
      staging と DB / Core を共有し iso.no-shared-state に反するため廃止する。PR 単位の preview が必要になった場合は
      Cloud Run revision tag (no-traffic URL) を staging 内で使う。
