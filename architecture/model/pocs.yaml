  - id: poc.cloud-build-ci
    title: Core CI on Cloud Build instead of private GitHub Actions minutes
    hypothesis: Core の fmt / clippy / test (実 PG) を Cloud Build free tier 内で回せる。
    method: >-
      Cloud Scheduler → sa-ci-dispatcher を起動。dispatcher は GCP-native auth で Infisical から Tastile CI GitHub App private key を取得し、
      short-lived installation token で対象 Core PR head をdownload、private GCS source bucketへuploadして Cloud Build APIを呼ぶ。
      dispatcherはADR-0023のrequest課金・非公開Cloud Run serviceとし、同一project SchedulerのOIDCを検証する。
      通常PR品質gateはsa-cloud-build-ci、e2-standard-2/jobs2、PostgreSQL17 sidecar、sampleごとに空target/cache、1800秒上限とする。
      fmt/clippy全target/v0 build/実migrator/全workspace実PG test/required statusを維持し、独立baseline compileとrollback smokeは配備前gateへ分離する。
      配備前gateはexact candidate SHA/source generation/digest、trusted baseline SHA/archive generation/digest、recipe、候補api/migratorのpackage/target/profile/binary digestを固定する。
      candidate migration後の独立baseline target/API/workerで認証済みwrite/read/materialize/reflowとDB cleanupを実行し、stateful migrationとserving trafficの前に成功証跡を照合する。
      no-traffic diagnostic revisionの起動とmissing-config/fail-closed確認は先行可能だが、rollback未成功を実利用成功や配備承認に読み替えない。
      PR codeへsecret/Infisical/deploy権限を渡さず、trusted operator/deployment経路がsourceを固定してgateを呼ぶ。
      通常PR品質の新exact SHA/source generation/recipeが自動経路で1回SUCCESSになるまでcold10を反復しない。その後同一構成の10cold sampleでmedian25分以下と40run/月1000分以下を評価する。
      release時rollbackの回数・時間・image buildを通常PRの1000分へ隠さず別記し、月間総量を40×PR中央値+release回数×rollback所要時間+image buildとして2500分無料枠と照合する。
      rollback安全性は性能未達を理由に省略しない。性能PoCの未達だけでms.m3-core-stagingの実装・診断配備を停止しない。
      2026-10-06にdevの実metadata→Infisical key-name限定read→GitHub AppとScheduler200、未認証/非invoker403、他key/path/environment/project/prod403を観測済み。その後Core PR212/c08e77e4の自動build投入からGitHub status successまで完了し、PG17 full940/0/0、24分9.167秒を観測。Core実装6477212はPG17 full942/0/0・全step成功後でも30分のbuild全体TIMEOUTとなったため計測成功に含めず、CI profileを改善して再検証する。4e8a88dは全106groups942/0/0とbuild SUCCESSを達成したが単発26分24.219秒で25分基準を超えたため、追加9回より先に共通targetを適用し、新SHA/recipeでcohortを固定する。2026-10-07の4333400 cold10回は全SUCCESS/106groups942/0/0だが中央値26.3427分・40回/月1053.71分で基準失敗。9633837のtrusted rollback recipeはbaseline generation/digest取得成功後の独立baseline compile中に1800秒TIMEOUT。全gateを保持し、新recipeで再検証する。2026-10-08のf98c58e build-local cache recipeもPG17 full106groups942/0/0後、rollbackのcandidate再compile中に1800秒TIMEOUTとなった。baseline startupは未到達、terminal cache statsと新cold10中央値は未観測。観測と次のmanifest検証計画はdocs/evidence/2026-10-08-ci-candidate-recompile.mdに記録する。2026-10-14の3d7b0d build8499d6f4はcandidateの通常bin seal・実migrator・PG17 full106groups942/0/0が完了したが、clippy536秒・precompile814秒・tests249秒の後、独立baseline compile中に1800秒TIMEOUTとなった。candidate再compileは除去済みでも旧API/worker smoke・terminal cache stats・新cold10は未到達。docs/evidence/2026-10-14-ci-precompile-timeout.mdに失敗証跡を保存し、同じ初期空targetでno-runとclippyの順序によるmetadata再利用を小さいLinux fixtureで調べる。順序変更の採用・成功は未確定。
      2026-10-14の共有target版6429407 build6b9591dfも、clippy494秒・precompile700秒・tests275秒（106groups942/0/0）の後、独立baseline compile中に1800秒TIMEOUTとなった。local全gate/rollback成功とhosted失敗を分け、terminal cache stats・新cold10未到達をdocs/evidence/2026-10-15-ci-shared-target-timeout.jsonへ保存する。追加replicaは投入しない。2026-10-15の方針修正で通常PR品質と配備前rollbackを分離し、2CPU/jobs2/1800秒と独立baselineのtrust境界を維持して各gateを検証する。
      2026-10-15の固定642/9bによるlocal cache入力実験では、新空の独立target二つと新空1GiB cacheでcandidate449miss、baseline313hit/91miss（77.475%）、error0を観測した。選択heavy crateのfeatureは同じでも一部compiler metadata/inputは異なり、aggregate statsから個別91miss原因は断定しない。最後のdebuginfo flagは0、cache最終425382260bytesで1GiB内。docs/evidence/2026-10-15-ci-cache-inputs.jsonにsource blob照合・phase stats・artifact/argv digest・cleanupを保存する。local入力検証でありhostedTIMEOUTや旧cold10FAILは解消していない。
    decides: [adr.root.0020]
    status: running
    executed_at: 2026-10-08
    evidence: docs/evidence/2026-10-08-ci-duration.md
    criteria:
      - {id: c1, metric: median_duration_min, op: "<=", threshold: 25, observed: 26.342666666666666, result: fail, note: "4333400の旧一体gate cold10観測。分離後PR品質の初回成功・新cohortは未検証。"}
      - {id: c2, metric: monthly_minutes_at_40_runs, op: "<=", threshold: 1000, observed: 1053.7066666666667, result: fail, note: "同じ旧一体gate cohort中央値から換算。新通常PR値は未検証。release rollback時間は別途合算する。請求額の観測ではない。"}
      - {id: c3, metric: status_reported_to_github_check, op: "==", threshold: true, observed: true, result: pass}
      - {id: c4, metric: provider_managed_github_credentials_outside_infisical, op: "==", threshold: 0}
      - {id: c5, metric: github_private_key_visible_to_pr_build, op: "==", threshold: false}

  - id: poc.restore-drill
