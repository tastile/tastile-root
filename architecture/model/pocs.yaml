# PoC definitions, success criteria and results. Canonical for: fd.poc.
# Every criterion is machine-checkable: `metric` + `op` + `threshold`; `observed` is filled from evidence.
# status: planned | running | passed | failed | partial.  A decision may only rely on passed criteria;
# anything else must stay in risks.yaml as unverified.
schema: tastile.architecture/pocs@1
as_of: 2026-10-08

pocs:
  - id: poc.local-runtime
    title: Core API / Worker on vanilla PostgreSQL 17 (provider-neutral runtime baseline)
    hypothesis: >-
      Core は AWS / RDS 固有機能に依存せず、vanilla PostgreSQL 17 上で migration・起動・主要 read が成立し、
      serverless container に適した起動時間と memory footprint を持つ。
    method: >-
      portable PostgreSQL 17.11 (zonky embedded binaries) を local に起動し、crates-v1 を release build。
      空 DB に api を起動して migration 適用時間・起動時間・RSS を測り、主要 GET を 50 回ずつ計測。
    decides: [adr.root.0014]
    status: partial
    executed_at: 2026-09-29
    evidence: architecture/evidence/2026-09-29-local-runtime-poc.md
    criteria:
      - {id: c1, metric: migrations_apply_on_vanilla_pg17, op: "==", threshold: true, observed: true, result: pass}
      - {id: c2, metric: required_extensions, op: subset_of, threshold: [plpgsql, pgcrypto], observed: [plpgsql, pgcrypto], result: pass}
      - {id: c3, metric: "api_start_to_healthy_s (migrated DB, AWS_REGION set)", op: "<", threshold: 1.0, observed: 0.042, result: pass}
      - {id: c4, metric: "api_start_to_healthy_s (default env)", op: "<", threshold: 1.0, observed: 3.03, result: fail, note: "AWS SDK IMDS region probe blocks startup ≈3 s off-AWS (finding f.imds-startup)"}
      - {id: c5, metric: api_rss_mb_idle, op: "<", threshold: 128, observed: 22, result: pass}
      - {id: c6, metric: stripped_api_binary_mb, op: "<", threshold: 100, observed: 44.4, result: pass}
      - {id: c7, metric: "get_v1_sync_p95_ms (local)", op: "<", threshold: 50, observed: 2.7, result: pass}
      - {id: c8, metric: "get_v1_tiles_p95_ms (500 tiles, local)", op: "<", threshold: 300, observed: 84.8, result: pass}
    findings:
      - id: f.imds-startup
        text: avatar 用 AWS SDK client が起動時に IMDS region probe を行い、AWS 外では 3 s 起動を遅らせる。
        action: object storage を provider-neutral port にし、region / endpoint を明示 config にする (ms.m3-core-staging)。
      - id: f.migrations-at-startup
        text: api と worker の双方が起動時に DDL 権限で migration を実行する (storage::Store::connect)。
        action: ctr.core-migrate job に分離し runtime role を DML のみにする (ADR-0017)。
      - id: f.pool-size
        text: pool max_connections が 16 固定 (storage/src/pool.rs)。db-f1-micro (max 25) では api+worker+web で超過し得る。
        action: pool size を config 化し deployment.yaml の connection budget に従う。
      - id: f.startup-recovery-on-boot
        text: worker 起動時に ACTIVE Execution 全件へ startup-recovery prompt を出す (worker/src/main.rs)。deploy / scale のたびに user へ prompt が出る。
        action: prompt 生成を process 起動ではなく domain fact (heartbeat 途絶等) から導出する (ADR-0017, core issue)。
      - id: f.e2e-harness-drift
        text: scripts/usecase-e2e は 410 (legacy Recurring writes deprecated) で 15/18 FAIL。受け入れ harness が API から drift。
        action: SourceTile API へ harness を更新し staging smoke に組み込む。

  - id: poc.core-suite-vanilla-pg
