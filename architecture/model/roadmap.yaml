# Migration roadmap from current (AWS/EC2 + Infisical) to target (GCP Cloud Run + Cloud SQL + retained Infisical
# behind Cloudflare). Canonical for: fd.migration-roadmap.
# Sequence follows the 2026-09-28 intent (raw corpus): freeze behaviour → migrate infra → finish secrets on the
# target runtime → staging verification → production cutover → soak → public announcement.
# `authority: operator` marks steps that need actor.operator (billing, production mutation, public release).
# 2026-10-20: paid-infrastructure freeze (ADR-0024). ms.pause-paid-infra gates every milestone that needs a billed
# environment (m2〜m7). Local-only work inside them (provider-neutral code, local real-PG gates) may continue.
schema: tastile.architecture/roadmap@1
as_of: 2026-10-20

milestones:
  - id: ms.pause-paid-infra
    title: Paid infrastructure frozen; local-only development
    authority: operator
    work:
      - 2026-10-20 AWS all resources deleted without data retention; GCP tastile-dev / staging / prod billing unlinked (ADR-0024)
      - develop and verify on env.local only (real PostgreSQL 17, real browser / device); ci uses free tiers only
      - no billing link, tofu apply, Cloud Run / Cloud SQL / Cloud Build start, AWS resource or paid plan by agents; escalate to operator
    exit_criteria:
      - operator records a resumption root ADR with a funded monthly fixed-cost ceiling reflected in quality.yaml cost_budget
      - tofu plan against surviving resources / backed-up state reviewed before any apply
    tracking: [tastile/tastile-root#102]
    status: in_progress
  - id: ms.m0-sot
    title: Architecture SoT established
    repos: [repo.root, repo.core]
    exit_criteria:
      - bun run architecture:validate passes on root
      - core docs/product and v1 pointers aligned (core#199)
    tracking: [tastile/tastile-root#48, tastile/tastile-core#199]
    status: done
  - id: ms.m1-freeze
    title: Observable product behaviour freeze
    depends_on: [ms.m0-sot]
    exit_criteria:
      - only bug fixes and platform-neutral refactors merge to release branches until ms.m6-cutover
      - core full gate green on real PostgreSQL (fix 3 failing tests; kpi.ci-real-db)
    tracking: [tastile/tastile-core#201, tastile/tastile-web#169]
    status: done
  - id: ms.m2-foundation
    title: Target platform foundation
    depends_on: [ms.m0-sot, ms.pause-paid-infra]
    authority: operator
    work:
      - GCP billing account, projects tastile-dev / tastile-staging / tastile-prod, budget alerts (cost_budget)
      - Artifact Registry, Cloud Build execution identities, private CI source bucket, GCP WIF pools per deploy repository
      - Tastile CI GitHub App + Infisical-only private key + trusted ci-dispatcher
      - Infisical machine identities for GitHub OIDC and GCP-native workload auth; environment/service access boundaries
      - IaC under root infra/ (OpenTofu or gcloud scripts; tool choice is part of ms.m2-foundation) — becomes canonical for real resources
    exit_criteria:
      - poc.infisical-workload-auth passed for GitHub OIDC path; GCP workload path may complete in ms.m3-core-staging before production cutover
      - poc.cloud-build-ci passed
    tracking: [tastile/tastile-root#50]
    status: in_progress
  - id: ms.m3-core-staging
    title: Core on Cloud Run staging
    depends_on: [ms.m1-freeze, ms.pause-paid-infra]
    work:
      - staging配備に必要なproject/API/service identity/registry/IaCとInfisical境界を実確認する。ms.m2-foundation全体の性能PoC完了は着手条件にしない
      - OCI image with api / worker / migrate entrypoints; stripped binary; no AWS SDK default-chain probing (f.imds-startup)
      - migration job + DML-only runtime role (f.migrations-at-startup)
      - configurable pool sizes (f.pool-size)
      - worker drain entrypoint + Cloud Scheduler 1 min sweep (ADR-0017); targeted wake は SLO 未達時だけ provider-neutral port 経由で追加; startup-recovery prompt derived from facts (f.startup-recovery-on-boot)
      - object storage port → R2 media bucket
      - FCM HTTP v1 direct delivery via service account (ADR-0018)
    exit_criteria:
      - poc.cloud-run-core passed
      - poc.worker-drain passed
      - poc.restore-drill passed (staging)
      - exact candidate/baselineに対する実PG rollback証明をstateful migrationとserving trafficの前に取得し、API read/writeとworker実行を実環境で確認する
    tracking: [tastile/tastile-core#202]
    status: in_progress
  - id: ms.m4-web-staging
    title: Web on Cloud Run staging, JWT assertion, edge router
    depends_on: [ms.m3-core-staging]
    work:
      - web image on Cloud Run (standalone); Better Auth on Cloud SQL auth DB
      - Better Auth jwt plugin + Core JWKS verification; remove bridge secret (ADR-0016)
      - edge router Worker with edge assertion
      - email provider switch (ADR-0018)
      - retire Cloudflare Worker preview / staging (env.preview)
    exit_criteria:
      - poc.web-cloud-run passed
      - poc.jwt-assertion passed
      - poc.email-provider passed
    tracking: [tastile/tastile-web#171]
    status: planned
  - id: ms.m5-clients
    title: Client alignment
    depends_on: [ms.m4-web-staging]
    work:
      - connect flow (Authorization Code + PKCE) for Android and Desktop; retire /api/mobile/api-token
      - Desktop uses Core API token as v1 Bearer (oq.desktop-bearer); Desktop contract drift check
      - alert schedule read model consumption (oq.alert-schedule); remove Android dead JNI path
      - all consumers pin the same tastile-openapi tag (ADR-0019); remove root openapi submodule
    exit_criteria:
      - real-device Android and real Windows smoke against staging with the same test identity
    tracking: [tastile/tastile-android#65, tastile/tastile-desktop#44, tastile/tastile-cli#5]
    status: planned
  - id: ms.m6-cutover
    title: Production launch on GCP (AWS source deleted 2026-10-20)
    depends_on: [ms.m5-clients, ms.m1-freeze]
    authority: operator
    work:
      - AWS runtime and RDS no longer exist (ADR-0024); there is no data migration or AWS rollback path, production starts from an empty Cloud SQL
      - fresh production deploy behind the edge router; DNS / edge switch
    exit_criteria:
      - production /v1/ready, auth e2e and client smoke pass on GCP
      - journal entries in docs/journal/production for every external mutation
    status: planned
  - id: ms.m7-soak
    title: Soak with SLO evidence
    depends_on: [ms.m6-cutover]
    exit_criteria:
      - 14 consecutive days meeting slo.api-availability / slo.web-availability / slo.work-lag pre-launch targets
      - first 14 days actual spend extrapolates to cost_budget.pre_launch 以下 (or operator-recorded budget exception); poc.cost-30d continues after launch
      - production restore drill passed
    status: planned
  - id: ms.m8-decommission
    title: Decommission AWS and legacy secret paths
    depends_on: [ms.m7-soak]
    authority: operator
    work:
      - "done early 2026-10-20 (ADR-0024): AWS stacks, RDS (no export, beta had no users), EC2, S3 / CloudFront, ECR, Cognito deleted; Secrets Manager scheduled for deletion"
      - verify remaining AWS IAM users / roles, SES identities and SSM parameters are gone or free
      - retire AWS-specific Infisical auth bindings / obsolete secret replicas while retaining Infisical as the canonical secret control plane
      - remove core deploy/aws, deploy/systemd, docs/production AWS runbooks (history stays in git)
    exit_criteria:
      - kpi.secret-stores == 1 per environment
      - no repository references AWS runtime or a second editable application-secret store; Infisical remains canonical
    status: planned
  - id: ms.m9-public-announcement
    title: Broad public announcement
    depends_on: [ms.m7-soak, ms.m8-decommission]
    authority: operator
    exit_criteria:
      - operator decision recorded as a root ADR or release PR with SLO / PoC evidence links
    status: planned
