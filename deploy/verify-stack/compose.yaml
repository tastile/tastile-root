# Verification stack for #105 (local-first practicalization).
# Independent, non-production environment: dedicated DB, port, volume and
# credentials. Never reuse operational data, secrets, or ports.
# Parallel instances: set TASTILE_VERIFY_PREFIX + a distinct compose project
# (-p) + distinct host ports and TASTILE_CORE_TAG; see README "並行インスタンス".
#
# Prereqs: side-by-side checkouts of tastile-core and (optionally)
# tastile-web as siblings of the tastile-root worktree (or override
# TASTILE_CORE_DIR / TASTILE_WEB_DIR).
#
# Preflight:     bash preflight.sh   (disk + resolved-config attestation)
# Stack guard:   ../../scripts/stack.sh <id> ...  (project/port/volume/image
#                preflight + allowlist; see deploy/stacks.tsv and
#                docs/runbooks/stack-operations.md — bare `docker compose`
#                is not the sanctioned path, root#183)
# Bring up:      scripts/stack.sh verify up --build -d
# Tear down:     scripts/stack.sh verify down -v   (also wipes the test DB)
# Health:        curl http://127.0.0.1:31410/v1/health

services:
  db:
    image: postgres:16-alpine
    container_name: ${TASTILE_VERIFY_PREFIX:-tastile-verify}-db
    environment:
      POSTGRES_USER: ${TASTILE_VERIFY_PG_USER:-tastile}
      POSTGRES_PASSWORD: ${TASTILE_VERIFY_PG_PASSWORD:-tastile-verify-only}
      POSTGRES_DB: ${TASTILE_VERIFY_PG_DB:-tastile_verify}
      # Verification role is local-only; intentionally weak password.
    volumes:
      - tastile-verify-pgdata:/var/lib/postgresql/data
    # Smaller connection ceiling for the two-pool verification workload
    # (NF04-R05 / root#145): api 10 + worker 10 + headroom.
    command: ["postgres", "-c", "max_connections=40"]
    ports:
      # Loopback-only host port; preflight rejects operational PostgreSQL ports.
      - "127.0.0.1:${TASTILE_VERIFY_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Smaller cgroup ceilings than prod; still enforced so limit behavior
    # can be exercised locally (NF04-R05 / root#145).
    deploy:
      resources:
        limits:
          cpus: ${TASTILE_VERIFY_DB_CPUS:-0.5}
          memory: ${TASTILE_VERIFY_DB_MEMORY:-512M}

  api:
    build:
      context: ${TASTILE_CORE_DIR:-../../../tastile-core}
      dockerfile: .wslc/Containerfile.v1
    image: tastile-core-verify:${TASTILE_CORE_TAG:-local}
    container_name: ${TASTILE_VERIFY_PREFIX:-tastile-verify}-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      TASTILE_DATABASE_URL: postgres://${TASTILE_VERIFY_PG_USER:-tastile}:${TASTILE_VERIFY_PG_PASSWORD:-tastile-verify-only}@db:5432/${TASTILE_VERIFY_PG_DB:-tastile_verify}
      DATABASE_URL: postgres://${TASTILE_VERIFY_PG_USER:-tastile}:${TASTILE_VERIFY_PG_PASSWORD:-tastile-verify-only}@db:5432/${TASTILE_VERIFY_PG_DB:-tastile_verify}
      TASTILE_API_HOST: ${TASTILE_API_HOST:-0.0.0.0}
      # Core listens on 31400 inside the container. TASTILE_API_PORT below
      # controls only the host-side published port.
      TASTILE_API_PORT: "31400"
      TASTILE_ENV: development
      # release-1-1-0 の storage::pool は未設定を拒否する（main は既定値で動く）。
      # 両系統で同じ compose を使えるよう明示的に与える。
      TASTILE_DATABASE__MAX_CONNECTIONS: ${TASTILE_DATABASE__MAX_CONNECTIONS:-10}
      # The browser talks to Core directly on localhost, so Core must allow
      # the web origin. Overridable so the stack still works when :3000 is
      # taken and the dev server has to run on another port.
      TASTILE_ALLOWED_ORIGINS: ${TASTILE_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TASTILE_WEB_BRIDGE_SECRET: ${TASTILE_WEB_BRIDGE_SECRET:?set TASTILE_WEB_BRIDGE_SECRET (any random string, verification use only)}
      TASTILE_DELIVERY_PROVIDER: fake
      TASTILE_MAX_REQUEST_BODY_BYTES: "2097152"
      TASTILE_REQUEST_TIMEOUT_SECONDS: "30"
      # Disk capacity floor (NF04-R05 / root#145): writes get 503 +
      # Retry-After below this floor; default suits a dev workstation.
      TASTILE_DISK_GUARD_PATH: /
      TASTILE_DISK_MIN_FREE_BYTES: ${TASTILE_DISK_MIN_FREE_BYTES:-1073741824}
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - "127.0.0.1:${TASTILE_API_PORT:-31410}:31400"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${TASTILE_VERIFY_API_CPUS:-1.0}
          memory: ${TASTILE_VERIFY_API_MEMORY:-1G}

  worker:
    image: tastile-core-verify:${TASTILE_CORE_TAG:-local}
    container_name: ${TASTILE_VERIFY_PREFIX:-tastile-verify}-worker
    depends_on:
      api:
        condition: service_started
    environment:
      TASTILE_DATABASE_URL: postgres://${TASTILE_VERIFY_PG_USER:-tastile}:${TASTILE_VERIFY_PG_PASSWORD:-tastile-verify-only}@db:5432/${TASTILE_VERIFY_PG_DB:-tastile_verify}
      DATABASE_URL: postgres://${TASTILE_VERIFY_PG_USER:-tastile}:${TASTILE_VERIFY_PG_PASSWORD:-tastile-verify-only}@db:5432/${TASTILE_VERIFY_PG_DB:-tastile_verify}
      TASTILE_ENV: development
      # api と同様。release-1-1-0 の storage::pool は未設定を拒否する。
      TASTILE_DATABASE__MAX_CONNECTIONS: ${TASTILE_DATABASE__MAX_CONNECTIONS:-10}
      TASTILE_DELIVERY_PROVIDER: fake
      # Same disk floor as api: drains are deferred while the filesystem
      # is below it (NF04-R05 / root#145).
      TASTILE_DISK_GUARD_PATH: /
      TASTILE_DISK_MIN_FREE_BYTES: ${TASTILE_DISK_MIN_FREE_BYTES:-1073741824}
      AWS_EC2_METADATA_DISABLED: "true"
    command: ["/app/worker"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${TASTILE_VERIFY_WORKER_CPUS:-0.5}
          memory: ${TASTILE_VERIFY_WORKER_MEMORY:-512M}

volumes:
  tastile-verify-pgdata:
    name: ${TASTILE_VERIFY_PREFIX:-tastile-verify}-pgdata
